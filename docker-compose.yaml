services:
  grafana-trmnl-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: grafana-trmnl-server
    restart: always
    ports:
      - '8080:8080'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - grafana-trmnl

networks:
  grafana-trmnl:
    driver: bridge
